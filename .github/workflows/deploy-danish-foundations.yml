name: Redirect Danish Foundations GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: danish-foundations-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.name == 'danish-foundations'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble redirect site
        run: |
          rm -rf redirect-site
          mkdir -p redirect-site
          cp -a deployment/danish-redirect/. redirect-site/
          cp redirect-site/index.html redirect-site/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect-site

  deploy:
    if: github.event.repository.name == 'danish-foundations'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
