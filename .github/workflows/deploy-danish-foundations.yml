name: Deploy Danish Foundations to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: danish-foundations-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.name == 'danish-foundations'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Danish curriculum
        run: npm run check:danish

      - name: Build Danish application for GitHub Pages
        run: npm run build:danish
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE: "/danish-foundations/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/danish-foundations/dist

  deploy:
    if: github.event.repository.name == 'danish-foundations'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
