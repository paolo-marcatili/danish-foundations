chapters:
  - id: "chapter_01_sparks"
    minimum_level: 1
    title:
      it: "Le scintille perdute"
      en: "The lost sparks"
    body:
      it: "Nel villaggio delle parole, le lettere armene hanno perso la loro luce. L'eroe segue il sentiero con spada e scudo, cercando quattro scintille: Forza, Difesa, Precisione e Resistenza.\n\nOgni allenamento riaccende una parte della lanterna. Quando cinque sessioni sono complete, il mostro del livello accetta la sfida."
      en: "In the village of words, the Armenian letters have lost their light. The hero follows the path with sword and shield, searching for four sparks: Strength, Defense, Precision, and Stamina.\n\nEvery training session relights part of the lantern. When five sessions are complete, the level monster accepts the challenge."
  - id: "chapter_02_ruins"
    minimum_level: 1
    title:
      it: "Le rovine incantate"
      en: "The enchanted ruins"
    body:
      it: "Dietro una porta coperta di muschio si nasconde un labirinto. Quattro rune proteggono il tesoro. Tra le stanze ci sono trappole, fonti, casse e guardiani. Il diario dell'avventura ricorda ogni scoperta."
      en: "Behind a moss-covered gate lies a labyrinth. Four runes protect the treasure. Its rooms contain traps, fountains, caches, and guardians. The adventure log remembers every discovery."
  - id: "chapter_03_echo"
    minimum_level: 2
    title:
      it: "Il campo dell'eco"
      en: "The echo camp"
    body:
      it: "Dopo il primo mostro, il sentiero raggiunge un campo dove le parole rimbalzano tra alberi e rocce. Nuove frasi e nuovi suoni aiutano l'eroe a capire messaggi più lunghi."
      en: "After the first monster, the path reaches a camp where words echo between trees and rocks. New sentences and sounds help the hero understand longer messages."

  - id: "chapter_04_a_day"
    minimum_level: 2
    title:
      it: "Lettura · una giornata"
      en: "Reading · a day"
    body:
      it: "Հայերեն · Անիի օրը սկսվում է առավոտյան։ Նա նախաճաշում է, գնում է դպրոց, սովորում է և խաղում ընկերների հետ։ Երեկոյան նա վերադառնում է տուն ու գիրք է կարդում։\n\nItaliano · La giornata di Ani comincia al mattino. Fa colazione, va a scuola, studia e gioca con gli amici. La sera torna a casa e legge un libro."
      en: "Armenian · Ani's day begins in the morning. She has breakfast, goes to school, studies and plays with friends. In the evening she returns home and reads a book."
  - id: "chapter_05_friends"
    minimum_level: 3
    title:
      it: "Lettura · due amici"
      en: "Reading · two friends"
    body:
      it: "Հայերեն · Արամը և Դավիթը ընկերներ են։ Նրանք միասին դպրոց են գնում, ֆուտբոլ են խաղում և օգնում են իրար։ Մի օր նրանք այգում փոքրիկ կատու են գտնում և ջուր են տալիս նրան։\n\nItaliano · Aram e Davit sono amici. Vanno a scuola insieme, giocano a calcio e si aiutano. Un giorno trovano un piccolo gatto nel parco e gli danno dell'acqua."
      en: "Aram and Davit are friends. They go to school together, play football and help each other. One day they find a small cat in the park and give it water."
