title: 
  it: "Il Sentiero delle Scintille"
  en: "The Spark Path"
opening: 
  it: "Le lettere del villaggio hanno perso le loro scintille. Cammina sul sentiero, allena ogni abilita e sconfiggi i mostri che bloccano i campi successivi."
  en: "The village letters have lost their sparks. Walk the path, train each skill, and defeat the monsters blocking the next camps."
