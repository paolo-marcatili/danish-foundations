    stat_cap: 8
    content_tags:
      - "stage:1"
    theme:
      da: Bogstaverne i, n og t, de første små ord og tallene til 5
      it: Le lettere i, n e t, le prime parole brevi e i numeri fino a 5
    learning_goal:
      da: Læs og byg korte ord som is, lim, tal og nat, og forbind tal med mængder til 5.
