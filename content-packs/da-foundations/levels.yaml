levels:
  - number: 0
    title: Lysets port
    stat_cap: 5
    content_tags:
      - "stage:0"
    theme:
      da: De første bogstaver og mængder fra 0 til 3
      it: Le prime lettere e le quantità da 0 a 3
    learning_goal:
      da: Lyt efter begyndelseslyde, genkend s, o, l, m og a, og tæl små mængder.
      it: Ascoltare i suoni iniziali, riconoscere s, o, l, m e a e contare piccole quantità.
