    title:
      da: Kapitel 11 · Historiehaven
      it: Capitolo 11 · Il giardino delle storie
    summary:
      da: Læs tre sætninger, og brug talvenner til 10.
      it: Leggere tre frasi e usare coppie fino a 10.
    fiction:
      da: I haven vokser historier som blomster. Hver historie har en begyndelse, en midte og en slutning.
      it: Nel giardino le storie crescono come fiori.
    lesson:
      title:
        da: Sæt oplysninger sammen
        it: Collega le informazioni
      objectives:
        - da: Læs tre sætninger, og brug talvenner til 10.
          it: Leggere tre frasi e usare coppie fino a 10.
        - da: Forklar dit valg med ord eller billeder.
          it: Spiegare la scelta con parole o immagini.
      explanation:
        da: Når du læser flere sætninger, skal du huske hvem teksten handler om, hvad der sker, og hvornår. Talvenner til 10 hjælper med hurtig regning.
        it: Con più frasi ricorda chi, cosa e quando. Le coppie fino a 10 aiutano il calcolo.
      examples:
        - target: Læs · tænk · svar
          translation:
            da: Tag én del ad gangen.
            it: Affronta una parte alla volta.
      common_mistakes:
        - da: Gæt ikke ud fra det første tegn; brug hele ordet eller hele opgaven.
          it: Non indovinare dal primo segno; usa tutta la parola o il problema.
    mission:
      da: Læs historierne og få haven til at blomstre.
      it: Leggi le storie e fai fiorire il giardino.
  - id: chapter_12_writing_workshop
    minimum_level: 12
    title:
      da: Kapitel 12 · Skriveværkstedet
      it: Capitolo 12 · Il laboratorio di scrittura
    summary:
      da: Færdiggør ord og sætninger, og regn inden for 20.
      it: Completare parole e frasi e calcolare entro 20.
    fiction:
      da: I værkstedet er bogstaver faldet ud af ordene. Helten får papir og blyant og reparerer dem ét tegn ad gangen.
      it: Nel laboratorio alcune lettere sono cadute dalle parole.
    lesson:
      title:
        da: Skrivning bygger på lyd og rækkefølge
        it: La scrittura usa suoni e ordine
      objectives:
        - da: Færdiggør ord og sætninger, og regn inden for 20.
          it: Completare parole e frasi e calcolare entro 20.
        - da: Forklar dit valg med ord eller billeder.
          it: Spiegare la scelta con parole o immagini.
      explanation:
        da: Lyt til ordet, sig lydene langsomt, og vælg det bogstav der mangler. En sætning skal have mellemrum og punktum.
        it: Ascolta, segmenta i suoni e scegli la lettera mancante. Una frase usa spazi e punto.
      examples:
        - target: Læs · tænk · svar
          translation:
            da: Tag én del ad gangen.
            it: Affronta una parte alla volta.
      common_mistakes:
        - da: Gæt ikke ud fra det første tegn; brug hele ordet eller hele opgaven.
          it: Non indovinare dal primo segno; usa tutta la parola o il problema.
    mission:
      da: Reparer værkstedets ord og løs fire regnestykker.
      it: Ripara le parole e risolvi quattro calcoli.
  - id: chapter_13_first_book
