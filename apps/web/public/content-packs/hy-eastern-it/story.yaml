title:
  it: Il Sentiero delle Scintille
  en: The Spark Path
opening:
  it: Ogni campo insegna poche parole utili e una regola magica. Gli allenamenti donano pietre diverse; la combinazione sulla porta apre il labirinto.
  en: Each camp teaches a small set of useful words and one magic rule. Training grants different stones; the combination on the door opens the labyrinth.
milestones: []
chapters:
  - id: chapter_stage_0
    minimum_level: 0
    title:
      it: Livello 0 · Prime scintille
      en: Level 0 · Prime scintille
    body:
      it: 'Missione · Lettere, saluti e parole essenziali.


        Regola magica · Anche una sola parola può essere un messaggio completo.


        Esempi · Բարև։ — Ciao! · Շնորհակալություն։ — Grazie.'
      en: 'Mission · Letters, greetings and essential words.


        Magic rule · Even one word can be a complete message.


        Examples · Բարև։ — Hello! · Շնորհակալություն։ — Thank you.'
  - id: chapter_stage_1
    minimum_level: 1
    title:
      it: Livello 1 · Chi sono?
      en: Level 1 · Chi sono?
    body:
      it: 'Missione · Presentarsi e chiedere il nome.


        Regola magica · In armeno la piccola forma del verbo «essere» spesso arriva alla fine.


        Esempi · Ես Անի եմ։ — Sono Ani. · Ի՞նչ է քո անունը։ — Come ti chiami?'
      en: 'Missione · Presentarsi e chiedere il nome.


        Regola magica · In armeno la piccola forma del verbo «essere» spesso arriva alla fine.


        Esempi · Ես Անի եմ։ — Sono Ani. · Ի՞նչ է քո անունը։ — Come ti chiami?'
  - id: chapter_stage_2
    minimum_level: 2
    title:
      it: Livello 2 · La mia famiglia
      en: Level 2 · La mia famiglia
    body:
      it: 'Missione · Famiglia, possesso e descrizioni.


        Regola magica · իմ significa «mio/mia»; սա introduce una persona o una cosa vicina.


        Esempi · Սա իմ մայրն է։ — Questa è mia madre. · Մեր տունը մեծ է։ — La nostra casa è grande.'
      en: 'Missione · Famiglia, possesso e descrizioni.


        Regola magica · իմ significa «mio/mia»; սա introduce una persona o una cosa vicina.


        Esempi · Սա իմ մայրն է։ — Questa è mia madre. · Մեր տունը մեծ է։ — La nostra casa è grande.'
  - id: chapter_stage_3
    minimum_level: 3
    title:
      it: Livello 3 · Ho fame e sete
      en: Level 3 · Ho fame e sete
    body:
      it: 'Missione · Bisogni, cibo e richieste gentili.


        Regola magica · Per dire ciò che desideri puoi usare ուզում եմ: «voglio».


        Esempi · Ես ջուր եմ ուզում։ — Voglio dell''acqua. · Ես սոված եմ։ — Ho fame.'
      en: 'Missione · Bisogni, cibo e richieste gentili.


        Regola magica · Per dire ciò che desideri puoi usare ուզում եմ: «voglio».


        Esempi · Ես ջուր եմ ուզում։ — Voglio dell''acqua. · Ես սոված եմ։ — Ho fame.'
  - id: chapter_stage_4
    minimum_level: 4
    title:
      it: Livello 4 · La mia giornata
      en: Level 4 · La mia giornata
    body:
      it: 'Missione · Azioni quotidiane e frasi utili a lezione.


        Regola magica · Le forme del presente raccontano ciò che succede adesso o abitualmente.


        Esempi · Ես դպրոց եմ գնում։ — Vado a scuola. · Չեմ հասկանում։ — Non capisco.'
      en: 'Missione · Azioni quotidiane e frasi utili a lezione.


        Regola magica · Le forme del presente raccontano ciò che succede adesso o abitualmente.


        Esempi · Ես դպրոց եմ գնում։ — Vado a scuola. · Չեմ հասկանում։ — Non capisco.'
  - id: chapter_stage_5
    minimum_level: 5
    title:
      it: Livello 5 · Dove siamo?
      en: Level 5 · Dove siamo?
    body:
      it: 'Missione · Luoghi, qui/là e domande con dove.


        Regola magica · Որտե՞ղ significa «dove?»; այստեղ e այնտեղ significano «qui» e «là».


        Esempi · Որտե՞ղ է դպրոցը։ — Dov''è la scuola? · Այգին այնտեղ է։ — Il parco è là.'
      en: 'Missione · Luoghi, qui/là e domande con dove.


        Regola magica · Որտե՞ղ significa «dove?»; այստեղ e այնտեղ significano «qui» e «là».


        Esempi · Որտե՞ղ է դպրոցը։ — Dov''è la scuola? · Այգին այնտեղ է։ — Il parco è là.'
  - id: chapter_stage_6
    minimum_level: 6
    title:
      it: Livello 6 · Numeri e tempo
      en: Level 6 · Numeri e tempo
    body:
      it: 'Missione · Età, numeri, oggi, domani e meteo.


        Regola magica · I numeri e le parole del tempo aiutano a raccontare quando e quanto.


        Esempi · Քանի՞ տարեկան ես։ — Quanti anni hai? · Այսօր եղանակը լավ է։ — Oggi il tempo è bello.'
      en: 'Missione · Età, numeri, oggi, domani e meteo.


        Regola magica · I numeri e le parole del tempo aiutano a raccontare quando e quanto.


        Esempi · Քանի՞ տարեկան ես։ — Quanti anni hai? · Այսօր եղանակը լավ է։ — Oggi il tempo è bello.'
  - id: chapter_stage_7
    minimum_level: 7
    title:
      it: Livello 7 · Noi e loro
      en: Level 7 · Noi e loro
    body:
      it: 'Missione · Plurali e negazione.


        Regola magica · ենք ed են sono forme plurali di «essere»; չենք rende negativa una forma con «noi».


        Esempi · Մենք ընկերներ ենք։ — Siamo amici. · Մենք չենք գնում։ — Non andiamo.'
      en: 'Missione · Plurali e negazione.


        Regola magica · ենք ed են sono forme plurali di «essere»; չենք rende negativa una forma con «noi».


        Esempi · Մենք ընկերներ ենք։ — Siamo amici. · Մենք չենք գնում։ — Non andiamo.'
  - id: chapter_stage_8
    minimum_level: 8
    title:
      it: Livello 8 · Piccole avventure
      en: Level 8 · Piccole avventure
    body:
      it: 'Missione · Dialoghi brevi e comprensione integrata.


        Regola magica · Combina saluti, persone, luoghi, tempo e azioni in un piccolo dialogo.


        Esempi · Բարև, ես Անի եմ։ Իսկ դու՞։ — Ciao, sono Ani. E tu? · Այսօր մենք դպրոց ենք գնում։ — Oggi andiamo a scuola.'
      en: 'Missione · Dialoghi brevi e comprensione integrata.


        Regola magica · Combina saluti, persone, luoghi, tempo e azioni in un piccolo dialogo.


        Esempi · Բարև, ես Անի եմ։ Իսկ դու՞։ — Ciao, sono Ani. E tu? · Այսօր մենք դպրոց ենք գնում։ — Oggi andiamo a scuola.'
